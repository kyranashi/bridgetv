# Публикует веб-версию на GitHub Pages: https://<владелец>.github.io/<репозиторий>/web/
# (Settings → Pages → Source: GitHub Actions). Открывается на ПК, Android, Smart TV.
# Внимание: страница по https не может играть http-потоки (их блокирует браузер) —
# для полного списка каналов используйте приложение или локальный сервер tools/serve.py.
name: Веб-версия на GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", "index.html", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Подготовить сайт
        run: |
          mkdir -p _site
          cp -R web data index.html _site/
          rm -f _site/data/sources_extra.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
