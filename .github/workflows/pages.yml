# Публикует веб-версию на GitHub Pages: https://<владелец>.github.io/<репозиторий>/web/
# (Settings → Pages → Source: GitHub Actions). Открывается на ПК, Android, Smart TV.
# Внимание: страница по https не может играть http-потоки (их блокирует браузер) —
# для полного списка каналов используйте приложение или локальный сервер tools/serve.py.
name: Веб-версия на GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", "index.html", "tools/build_epg.py", "tools/build_movies.py", ".github/workflows/pages.yml"]
  schedule:
    - cron: "20 2 * * *"        # каждый день — свежая программа передач (data/epg.json)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Программа передач (EPG)
        continue-on-error: true      # гид недоступен — сайт всё равно публикуется, приложение просто не покажет программу
        run: python tools/build_epg.py
      - name: Каталог фильмов (Apple + Wikidata)
        continue-on-error: true      # источник недоступен — сайт публикуется, приложение покажет «Бесплатно» и поиск
        run: python tools/build_movies.py
      - name: Подготовить сайт
        run: |
          mkdir -p _site
          cp -R web data index.html _site/
          # Свой адрес сайта (docs/SITE.md): переменная репозитория SITE_DOMAIN, напр. bridgetv.app
          if [ -n "${{ vars.SITE_DOMAIN }}" ]; then echo "${{ vars.SITE_DOMAIN }}" > _site/CNAME; fi
          rm -f _site/data/sources_extra.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
