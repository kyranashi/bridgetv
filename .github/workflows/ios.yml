# Собирает BridgeTV.ipa (iOS 9+, armv7 + arm64) на Linux тем же тулчейном, что и локально.
# Результат: артефакт «BridgeTV-ipa» у каждого запуска; при теге v* — ещё и релиз с BridgeTV.ipa.
name: Сборка iOS (BridgeTV.ipa)

on:
  push:
    branches: [main]
    paths: ["ios/**", "web/**", "data/catalog.js", "data/logos/**", "tools/setup_toolchain.sh", ".github/workflows/ios.yml"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Кэш тулчейна
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/iosbuild
          key: iosbuild-${{ hashFiles('tools/setup_toolchain.sh') }}
      - name: Тулчейн (clang + ld64 + ldid + iPhoneOS10.3.sdk)
        run: test -d ~/iosbuild/tc || bash tools/setup_toolchain.sh
      - name: Сборка
        run: bash ios/build.sh
      - name: Проверка бинарника
        run: |
          file ios/build/Payload/BridgeTV.app/BridgeTV || true
          ls -la ios/build/Payload/BridgeTV.app | head -n 40
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BridgeTV-ipa
          path: ios/build/BridgeTV.ipa
      - name: Подтверждение сборки (attestation) — gh attestation verify <файл> -R kyranashi/bridgetv
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ios/build/BridgeTV.ipa
      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ios/build/BridgeTV.ipa
