# Еженедельно пересобирает и проверяет каталог каналов (data/catalog.json, data/catalog.js)
# и коммитит изменения. Приложения подхватывают его кнопкой «Обновить список каналов».
#
# Проверка идёт с серверов GitHub (за границей), поэтому Россия и Беларусь проверяются
# «мягко» (--soft ru,by): каналы с гео-блоком не прячутся. Точную проверку из своей
# сети делайте локально: python tools/build_catalog.py — и коммитьте результат.
name: Обновление каталога каналов

on:
  schedule:
    - cron: "0 3 * * 1"      # понедельник, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Собрать и проверить каталог
        run: python tools/build_catalog.py --soft ru,by
      - name: Иконки каналов РФ/РБ (встраиваются в приложение)
        run: |
          pip install --quiet pillow
          python tools/build_logos.py
      - name: Закоммитить, если изменился
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/catalog.js data/logos
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Каталог каналов: автообновление $(date -u +%Y-%m-%d)"
          git push
