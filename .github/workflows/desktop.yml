# Программа для ПК: Windows (установщик + переносная .exe) и Linux (AppImage). Electron, desktop/.
# При теге v* файлы прикрепляются к релизу.
name: ПК (Windows, Linux)

on:
  push:
    branches: [main]
    paths: ["desktop/**", "web/**", "data/catalog.js", ".github/workflows/desktop.yml"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Сборка
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          V="$(grep -o "TV.VERSION = '[^']*'" ../web/js/core.js | cut -d"'" -f2)"
          # Точные версии всех библиотек — из package-lock.json (npm ci ставит ровно их и сверяет хэши).
          # Без файла (первый запуск) — npm install, а получившийся файл выкладывается артефактом,
          # чтобы его закоммитить. Так в сборку не подтянется подменённая «свежая» версия чужой библиотеки.
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else echo "NEW_LOCK=1" >> "$GITHUB_ENV"; npm install --no-audit --no-fund; fi
          npm pkg set version="$V"
          npx electron --version || true
          npm run dist
      - name: Файл версий библиотек (если его ещё нет в репозитории)
        if: env.NEW_LOCK == '1' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-package-lock
          path: desktop/package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BridgeTV-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Подтверждение сборки (attestation) — gh attestation verify <файл> -R kyranashi/bridgetv
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'out/*'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: out/*
