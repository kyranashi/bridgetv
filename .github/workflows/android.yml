# Собирает BridgeTV.apk (Android 4.4+, телефоны, планшеты, Android TV) из android/ + web/ + data/.
# Подпись:
#   • если заданы секреты ANDROID_KEYSTORE_B64 и ANDROID_KS_PASS — постоянный ключ проекта
#     (обновления ставятся поверх старой версии), см. docs/ANDROID.md;
#   • иначе — отладочный ключ, который хранится в кэше CI между сборками.
# Результат: артефакт «BridgeTV-apk»; при теге v* — файл в релизе.
name: Сборка Android (BridgeTV.apk)

on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", "data/catalog.js", "data/logos/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          gradle-version: "8.5"
      - name: Отладочный ключ (если нет постоянного)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.android/debug.keystore
          key: bridgetv-debug-keystore
      - name: Постоянный ключ подписи из секретов
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bridgetv-release.p12"
            echo "BTV_KEYSTORE=$RUNNER_TEMP/bridgetv-release.p12" >> "$GITHUB_ENV"
            echo "Подпись: постоянный ключ проекта"
          else
            echo "Подпись: отладочный ключ (секрет ANDROID_KEYSTORE_B64 не задан)"
          fi
      - name: Сборка APK
        env:
          BTV_KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Проверка
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          mkdir -p out && cp "$APK" out/BridgeTV.apk
          unzip -l out/BridgeTV.apk | grep -E "assets/www/web/index.html|assets/www/data/catalog.js|classes.dex"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BridgeTV-apk
          path: out/BridgeTV.apk
      - name: Подтверждение сборки (attestation) — gh attestation verify <файл> -R kyranashi/bridgetv
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: out/BridgeTV.apk
      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: out/BridgeTV.apk
