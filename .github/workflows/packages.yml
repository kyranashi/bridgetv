# Пакеты для остальных платформ: веб-версия (.zip для ПК), Samsung Smart TV (.wgt), LG webOS (.ipk).
# Делает tools/package.py (только стандартный Python). При теге v* — файлы в релизе.
name: Пакеты (web.zip, Tizen .wgt, webOS .ipk)

on:
  push:
    branches: [main]
    paths: ["web/**", "data/catalog.js", "data/logos/**", "tools/package.py", "tools/serve.py", ".github/workflows/packages.yml"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Версия
        run: |
          V="${GITHUB_REF_NAME#v}"; [ "${GITHUB_REF_TYPE}" = "tag" ] || V="$(grep -o "TV.VERSION = '[^']*'" web/js/core.js | cut -d"'" -f2)"
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Пакеты
        run: python tools/package.py "$V"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BridgeTV-packages
          path: dist/*
      - name: Подтверждение сборки (attestation) — gh attestation verify <файл> -R kyranashi/bridgetv
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'
      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
